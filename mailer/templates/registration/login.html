<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Application Dispatcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin: auto;
            margin-top: 10vh;
        }
    </style>
</head>
<body>

<div class="container login-container">
    <div class="card shadow-sm border-0">
        <div class="card-body p-5">
            <h4 class="card-title fw-bold text-center mb-4">Job Bot Admin</h4>
            
            {% if form.errors %}
                <div class="alert alert-danger small p-2 text-center">
                    Your username and password didn't match. Please try again.
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_username" class="form-label fw-semibold small">Username</label>
                    <input type="text" name="username" class="form-control" autofocus required id="id_username">
                </div>
                
                <div class="mb-4">
                    <label for="id_password" class="form-label fw-semibold small">Password</label>
                    <input type="password" name="password" class="form-control" required id="id_password">
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login</button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>
        </div>
    </div>
    <div class="text-center mt-3 text-muted small">
        &copy; 2026 Job Bot System Developed by Shahbaz Alam
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
