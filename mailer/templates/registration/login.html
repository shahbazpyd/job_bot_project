<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Job Bot Dispatcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .login-container {
            max-width: 420px;
            margin: auto;
            margin-top: 12vh;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            color: #ffffff;
        }
        .form-control {
            color: #ffffff !important;
            background-color: #0f172a !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
        }
        .form-control:focus {
            color: #ffffff !important;
            background-color: #1e293b !important;
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.3) !important;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5) !important;
        }
        /* Chrome / Edge autofill text color fix */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #0f172a inset !important;
            box-shadow: 0 0 0px 1000px #0f172a inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        body, p, span, div, label, h4 {
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container login-container">
    <div class="card glass-card">
        <div class="card-body p-4 p-sm-5">
            <h4 class="card-title fw-bold text-center mb-4 text-white">🚀 Job Bot Admin</h4>
            
            {% if form.errors %}
                <div class="alert alert-danger small p-2 text-center text-white" style="background-color: rgba(220, 38, 38, 0.35); border-color: rgba(220, 38, 38, 0.6);">
                    Your username and password didn't match. Please try again.
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_username" class="form-label fw-semibold small text-white">Username</label>
                    <input type="text" name="username" class="form-control" autofocus required id="id_username">
                </div>
                
                <div class="mb-4">
                    <label for="id_password" class="form-label fw-semibold small text-white">Password</label>
                    <input type="password" name="password" class="form-control" required id="id_password">
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold text-white" style="background: linear-gradient(135deg, #4f46e5, #7c3aed); border: none;">Login</button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>
        </div>
    </div>
    <div class="text-center mt-3 text-white small" style="opacity: 0.85;">
        &copy; 2026 Job Bot System Developed by Shahbaz Alam
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
